name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      ENVIRONMENT: testing
      SECRET_KEY: ci-sqlite-secret-key-for-tests-only
      SENTINEL_RUN_POSTGRES_TESTS: "0"
      SENTINEL_TEST_DATABASE_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend tests with SQLite
        run: python -m pytest backend/tests -q -rs

  ml-tests:
    name: ML tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-ml-secret-key-for-tests-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run ML tests
        run: python -m pytest ml/tests -q

  postgres-tests:
    name: PostgreSQL migration and integration tests
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      POSTGRES_DB: sentinel_ci_test
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_USER: postgres
      CI_SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      SENTINEL_RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate secrets and export derived database URLs
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote

          missing = [
              name
              for name in ("POSTGRES_PASSWORD", "CI_SECRET_KEY")
              if not os.environ.get(name)
          ]
          if missing:
              raise SystemExit("Missing required CI secrets: " + ", ".join(missing))

          secret_key = os.environ["CI_SECRET_KEY"]
          if len(secret_key) < 32:
              raise SystemExit("CI_SECRET_KEY must be at least 32 characters long.")

          encoded_password = quote(os.environ["POSTGRES_PASSWORD"])
          database_url = (
              "postgresql+psycopg2://postgres:"
              f"{encoded_password}@localhost:5432/sentinel_ci_test"
          )

          print("::add-mask::" + os.environ["POSTGRES_PASSWORD"])
          print("::add-mask::" + secret_key)
          print("::add-mask::" + encoded_password)
          print("::add-mask::" + database_url)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DATABASE_URL={database_url}\n")
              env_file.write(f"SENTINEL_TEST_DATABASE_URL={database_url}\n")
              env_file.write(f"SECRET_KEY={secret_key}\n")
          PY

      - name: Validate disposable PostgreSQL target
        run: |
          python - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          url = os.environ["DATABASE_URL"]
          parsed = urlparse(url)
          database = unquote(parsed.path.lstrip("/"))
          allowed_hosts = {"localhost", "127.0.0.1", "::1"}

          if parsed.query:
              raise SystemExit("Refusing PostgreSQL URL with query parameters.")
          if parsed.fragment:
              raise SystemExit("Refusing PostgreSQL URL with fragments.")
          if parsed.scheme not in {"postgresql", "postgresql+psycopg2"}:
              raise SystemExit("Refusing unsupported PostgreSQL URL scheme.")
          if parsed.hostname not in allowed_hosts:
              raise SystemExit("Refusing non-loopback PostgreSQL target.")
          if parsed.username != "postgres":
              raise SystemExit("Refusing unexpected PostgreSQL user.")
          if parsed.port not in (None, 5432):
              raise SystemExit("Refusing unexpected PostgreSQL port.")
          if database != "sentinel_ci_test":
              raise SystemExit("Refusing non-disposable PostgreSQL database.")
          if os.environ.get("ENVIRONMENT") != "testing":
              raise SystemExit("PostgreSQL CI requires ENVIRONMENT=testing.")

          print("Validated disposable PostgreSQL target: sentinel_ci_test")
          PY

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Start disposable PostgreSQL service
        run: |
          docker run --detach \
            --name sentinel-postgres-ci \
            --env POSTGRES_USER="$POSTGRES_USER" \
            --env POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --env POSTGRES_DB="$POSTGRES_DB" \
            --publish 5432:5432 \
            postgres:18.1

          for attempt in $(seq 1 30); do
            if docker exec sentinel-postgres-ci \
              pg_isready --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
              >/dev/null 2>&1; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL failed to become ready."
          docker logs sentinel-postgres-ci
          exit 1

      - name: Run Alembic migrations against disposable PostgreSQL database
        working-directory: backend
        run: alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m pytest backend/tests/test_postgres_integration.py -q -rs

      - name: Stop disposable PostgreSQL service
        if: always()
        run: docker rm --force sentinel-postgres-ci
